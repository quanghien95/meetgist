# Contributor License Agreement check (CLA Assistant Lite).
# Runs on every pull request. A contributor signs by posting the exact comment:
#   "I have read the CLA Document and I hereby sign the CLA"
# Signatures are stored in this repo at signatures/version1/cla.json.
# No external app or personal access token needed — uses the built-in GITHUB_TOKEN.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write       # to commit signatures back to this repo
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # Pin can be bumped to the latest release of contributor-assistant/github-action.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/MeetGist/meetgist/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'longfuxu,dependabot[bot]'
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before it can be merged, please read our
            [Contributor License Agreement](https://github.com/MeetGist/meetgist/blob/main/CLA.md)
            and sign it by posting the comment shown below in this PR.
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
