name: MeetGist
options:
  bundleIdPrefix: app.meetgist
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Local SPM engine (..) + the global-hotkey package.
packages:
  MeetGistKit:
    path: ..
  KeyboardShortcuts:
    path: ../Vendor/KeyboardShortcuts

targets:
  MeetGist:
    type: application
    platform: macOS
    # XcodeGen has no `resources:` key — everything (code + asset catalogs) goes under
    # `sources:`, and it classifies by type. The asset catalog MUST be listed here or
    # actool never runs and the app ships with no icon (CFBundleIconName/Assets.car).
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: MeetGistKit
        product: MeetGistKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetgist.MeetGist
        PRODUCT_NAME: MeetGist
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetGist.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
